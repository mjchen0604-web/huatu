services:
  autofigure-edit:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-docker.m.daocloud.io/library/python:3.11-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
    image: autofigure-edit:latest
    container_name: autofigure-edit
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      HF_HOME: /app/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGINGFACE_HUB_TOKEN: ${HF_TOKEN:-}
      OPENROUTER_MULTIMODAL_RETRIES: ${OPENROUTER_MULTIMODAL_RETRIES:-3}
      OPENROUTER_MULTIMODAL_RETRY_DELAY: ${OPENROUTER_MULTIMODAL_RETRY_DELAY:-1.5}
      ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY:-}
      ROBOFLOW_API_URL: ${ROBOFLOW_API_URL:-https://serverless.roboflow.com/sam3/concept_segment}
      ROBOFLOW_API_FALLBACK_URLS: ${ROBOFLOW_API_FALLBACK_URLS:-}
      FAL_KEY: ${FAL_KEY:-}
      BRIA_API_KEY: ${BRIA_API_KEY:-}
      AUTOFIGURE_ADMIN_PASSWORD: ${AUTOFIGURE_ADMIN_PASSWORD:-}
      AUTOFIGURE_DEFAULT_PROVIDER: ${AUTOFIGURE_DEFAULT_PROVIDER:-sub2api}
      AUTOFIGURE_DEFAULT_API_KEY: ${AUTOFIGURE_DEFAULT_API_KEY:-}
      AUTOFIGURE_DEFAULT_BASE_URL: ${AUTOFIGURE_DEFAULT_BASE_URL:-http://sub2api:8080/v1}
      AUTOFIGURE_DEFAULT_IMAGE_MODEL: ${AUTOFIGURE_DEFAULT_IMAGE_MODEL:-gpt-image-2}
      AUTOFIGURE_DEFAULT_SVG_MODEL: ${AUTOFIGURE_DEFAULT_SVG_MODEL:-gpt-5.5}
      AUTOFIGURE_DEFAULT_REASONING_EFFORT: ${AUTOFIGURE_DEFAULT_REASONING_EFFORT:-high}
      AUTOFIGURE_DEFAULT_SAM_BACKEND: ${AUTOFIGURE_DEFAULT_SAM_BACKEND:-roboflow}
      AUTOFIGURE_DEFAULT_SAM_PROMPT: ${AUTOFIGURE_DEFAULT_SAM_PROMPT:-icon,person,robot,animal}
      AUTOFIGURE_DEFAULT_SAM_API_KEY: ${AUTOFIGURE_DEFAULT_SAM_API_KEY:-}
      AUTOFIGURE_DEFAULT_RMBG_BACKEND: ${AUTOFIGURE_DEFAULT_RMBG_BACKEND:-local}
    dns:
      - ${DOCKER_DNS_1:-223.5.5.5}
      - ${DOCKER_DNS_2:-119.29.29.29}
    volumes:
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads
      - hf_cache:/app/.cache/huggingface
    networks:
      - default
      - sub2api-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  hf_cache:

networks:
  sub2api-network:
    external: true
    name: deploy_sub2api-network
