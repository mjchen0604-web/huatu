<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>智能画布</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=zh-20260427-snapshot-fix" />
  </head>
  <body data-page="canvas">
    <div class="canvas-page">
      <header class="topbar">
        <div>
          <div class="brand">智能画布</div>
          <div class="subtitle">
            状态：<span id="statusText">等待中</span>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="ghost step-btn" data-step="1">步骤 1</button>
          <button class="ghost step-btn" data-step="2">步骤 2</button>
          <button class="ghost step-btn" data-step="3">步骤 3</button>
          <button class="ghost step-btn" data-step="4">步骤 4</button>
          <button class="ghost step-btn" data-step="5">步骤 5</button>
          <button class="ghost" id="pauseJobBtn">暂停</button>
          <select class="compact-select" id="optimizeMoreIterations" aria-label="继续优化轮数">
            <option value="1" selected>追加优化 1 次</option>
            <option value="2">追加优化 2 次</option>
            <option value="3">追加优化 3 次</option>
          </select>
          <button class="ghost" id="optimizeMoreBtn">继续优化</button>
          <button class="ghost" id="backToConfigBtn">返回配置</button>
          <button class="ghost" id="archiveJobBtn">存档</button>
          <button class="ghost danger" id="deleteJobBtn">删除</button>
          <button class="ghost" id="logToggle">日志</button>
          <div class="job-pill">任务 <span id="jobId"></span></div>
        </div>
      </header>

      <main class="canvas-stage">
        <div class="canvas-shell">
          <iframe
            id="svgEditorFrame"
            class="svg-frame"
            title="SVG-Edit 画布"
          ></iframe>
          <div id="svgFallback" class="svg-fallback">
            <div id="fallbackTitle" class="fallback-title">正在等待 SVG 产物</div>
            <div class="fallback-body">
              任务生成模板或最终 SVG 后会自动载入画布。
            </div>
            <img id="fallbackImage" class="fallback-image" alt="产物预览" />
            <object id="fallbackObject" type="image/svg+xml" class="fallback-object"></object>
          </div>
        </div>
      </main>

      <button class="fab" id="artifactToggle" aria-label="产物">
        <svg class="fab-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2v10h14V7H5zm2 8l3-3 2 2 3-3 4 4H7z"
            fill="#f2f2f2"
          />
        </svg>
      </button>

      <aside class="artifact-panel" id="artifactPanel">
        <div class="panel-header">产物</div>
        <div class="artifact-list" id="artifactList"></div>
      </aside>

      <aside class="log-panel" id="logPanel">
        <div class="panel-header">日志</div>
        <div class="log-body" id="logBody"></div>
      </aside>
    </div>

    <script src="/app.js?v=zh-20260427-snapshot-fix"></script>
  </body>
</html>
